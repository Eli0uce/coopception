<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUB SPATIAL — Station Zéro</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/hub.css">

  <!-- Three.js importmap (fichier local) -->
  <script type="importmap">
  {
    "imports": {
      "three": "/js/vendor/three.module.min.js"
    }
  }
  </script>
</head>
<body>
<div class="scanline"></div>

<!-- Canvas Three.js (arrière-plan 3D) -->
<canvas id="hub-canvas"></canvas>

<div class="hub-layout">

  <!-- ── Header ── -->
  <header class="hub-header">
    <div class="hub-logo">
      <div class="title">◈ HUB SPATIAL ◈</div>
      <div class="subtitle">BASE DE COMMANDEMENT — SECTEUR ALPHA</div>
    </div>
    <div class="hub-meta">
      <div class="meta-badge" id="meta-role">—</div>
      <div class="meta-badge" id="meta-room">ROOM : —</div>
    </div>
  </header>

  <!-- ── Main ── -->
  <main class="hub-main">

    <div id="ending-banner" class="ending-banner" style="display:none;">
      <div class="ending-title" id="ending-title"></div>
      <div class="ending-text" id="ending-text"></div>
    </div>

    <div class="section-title">ÉTAT DE LA CAMPAGNE</div>
    <div class="resource-panel" id="resource-panel">
      <!-- Généré par hub.js -->
    </div>

    <div class="section-title">MISSIONS DISPONIBLES</div>
    <div class="mission-list" id="mission-list">
      <div class="hub-loading">◌ CONNEXION AU RÉSEAU DE LA STATION…</div>
    </div>
  </main>

  <!-- ── Footer ── -->
  <footer class="hub-footer">
    <span>STATION ZÉRO — PROTOCOLE COOPÉRATIF v2.0</span>
    <div class="hub-footer-actions">
      <button class="lobby-link" id="btn-reset">↺ RÉINITIALISER LA CAMPAGNE</button>
      <button class="lobby-link" id="btn-lobby">↩ RETOUR AU LOBBY</button>
    </div>
  </footer>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-auth.js"></script>
<script src="js/ws-client.js"></script>
<script src="js/hub.js"></script>
<!-- Scène Three.js chargée en module (après le DOM) -->
<script type="module" src="js/hub-scene.js"></script>
</body>
</html>
